<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shop the Archive — Alder &amp; Lane</title>
<meta name="description" content="Filter 36 made-to-order furniture pieces by category, room, material, colourway and price. Grid or editorial view.">
<meta property="og:title" content="Shop the Archive — Alder &amp; Lane">
<meta property="og:description" content="Filter 36 made-to-order furniture pieces by category, room, material, colourway and price. Grid or editorial view.">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400&family=Jost:wght@300;400;500&family=IBM+Plex+Mono:wght@400;500&family=Petit+Formal+Script&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/main.css"><link rel="icon" href="/favicon.ico">
</head>
<body>
<div id="site-header"></div>
<main>

<section class="wrap" style="padding-top:2.6rem">
  <p class="meta meta-brass">The catalogue</p>
  <h1 class="h-xl">Shop the Archive<span class="script">filter freely</span></h1>
  <p class="muted" style="max-width:38rem">Every piece is photographed as a plate and again in situ. Hover a plate to see it in a room.</p>
</section>
<section class="section wrap" style="padding-top:2.2rem">
  <div class="shop">
    <aside class="filters" id="filters" aria-label="Filters"></aside>
    <div>
      <div class="shop-bar">
        <span class="meta" id="count"></span>
        <div style="display:flex;gap:.6rem;align-items:center">
          <span class="view-toggle"><button data-view="grid">Grid</button><button data-view="list">Editorial</button></span>
          <label class="sr-only" for="sort">Sort</label>
          <select id="sort">
            <option value="curated">Curated order</option>
            <option value="new">Newest first</option>
            <option value="low">Price: low to high</option>
            <option value="high">Price: high to low</option>
          </select>
        </div>
      </div>
      <div class="chips" id="chips"></div>
      <div class="grid-products" id="results"></div>
    </div>
  </div>
</section>
</main>
<div id="site-footer"></div>
<script type="module" src="js/shop.js"></script>
</body>
</html>
