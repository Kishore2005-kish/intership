<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your Shopping Bag | Vanveda</title>
<meta name="description" content="Review your Vanveda bag, update quantities and check out with UPI, card or Cash on Delivery. Free shipping across India over ₹999.">
<meta property="og:title" content="Your Shopping Bag | Vanveda">
<meta property="og:description" content="Review your bag and check out with UPI, card or COD.">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/favicon.ico" type="image/x-icon">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Karla:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div data-header></div>
<main>
  <section class="page-head"><div class="wrap">
    <p class="crumbs"><a href="index.html">Home</a> / Cart</p>
    <h1>Your bag</h1>
  </div></section>
  <section class="section" style="padding-top:0"><div class="wrap">
    <div id="cart-root"></div>
  </div></section>
  <section class="section" style="padding-top:0"><div class="wrap">
    <h2 style="margin-bottom:1.6rem">You may also like</h2>
    <div class="grid" id="suggest"></div>
  </div></section>
</main>
<div data-footer></div>
<script src="/js/data.js"></script>
<script src="/js/cart.js"></script>
<script src="/js/ui.js"></script>
<script>
function renderCart() {
  var lines = window.Cart.detailed();
  var root = document.getElementById("cart-root");
  if (!lines.length) {
    root.innerHTML =
      '<div class="empty panel"><h2>Your bag is empty</h2>' +
      '<p class="muted">Start with our most-loved Nimba Cleanser or the Kumkumadi Glow Serum.</p>' +
      '<a class="btn" href="/products.html">Shop the range</a></div>';
    return;
  }
  var t = window.Cart.totals();
  root.innerHTML =
    '<div class="cart-layout"><div>' +
      lines.map(function (l) {
        return '<div class="line">' +
          '<a href="/product.html?id=' + l.product.id + '"><img src="' + l.product.img + '" alt="' + l.product.name + '"></a>' +
          '<div><span class="card-cat">' + l.product.category + " · " + l.product.size + "</span>" +
          '<h3 class="card-title" style="margin:.2rem 0 .6rem"><a href="/product.html?id=' + l.product.id + '">' + l.product.name + "</a></h3>" +
          '<div class="qty"><button data-dec="' + l.product.id + '" aria-label="Decrease quantity">−</button><span>' + l.qty +
          '</span><button data-inc="' + l.product.id + '" aria-label="Increase quantity">+</button></div></div>' +
          '<div style="text-align:right"><div class="price">' + window.formatINR(l.product.price * l.qty) + "</div>" +
          '<button class="remove" data-rm="' + l.product.id + '">Remove</button></div>' +
        "</div>";
      }).join("") +
    "</div>" +
    '<aside class="panel"><h3 style="font-family:var(--display);font-size:1.6rem">Order summary</h3>' +
      '<div class="summary-row"><span>Subtotal</span><span>' + window.formatINR(t.subtotal) + "</span></div>" +
      '<div class="summary-row"><span>Shipping</span><span>' + (t.shipping ? window.formatINR(t.shipping) : "Free") + "</span></div>" +
      '<div class="summary-row muted" style="font-size:.8rem"><span>GST</span><span>Included</span></div>' +
      '<div class="summary-row summary-total"><span>Total</span><span>' + window.formatINR(t.total) + "</span></div>" +
      '<a class="btn btn-block" style="margin-top:1.2rem" href="/checkout.html">Proceed to checkout</a>' +
      '<a class="btn btn-ghost btn-block" style="margin-top:.6rem" href="/products.html">Continue shopping</a>' +
      '<p class="muted" style="font-size:.78rem;margin-top:1rem">' +
      (t.shipping ? "Add " + window.formatINR(999 - t.subtotal) + " more for free shipping." : "Free shipping unlocked.") +
      " Delivered in 3–5 days across India.</p></aside></div>";
}

document.addEventListener("DOMContentLoaded", function () {
  renderCart();
  document.getElementById("suggest").innerHTML = window.VANVEDA_PRODUCTS.slice(4, 8).map(window.VanvedaUI.productCard).join("");
  window.VanvedaUI.initReveal();
  document.getElementById("cart-root").addEventListener("click", function (e) {
    var inc = e.target.closest("[data-inc]"), dec = e.target.closest("[data-dec]"), rm = e.target.closest("[data-rm]");
    var lines = window.Cart.detailed();
    function qtyOf(id) {
      var f = lines.filter(function (l) { return l.product.id === id; })[0];
      return f ? f.qty : 0;
    }
    if (inc) window.Cart.setQty(inc.getAttribute("data-inc"), qtyOf(inc.getAttribute("data-inc")) + 1);
    if (dec) window.Cart.setQty(dec.getAttribute("data-dec"), qtyOf(dec.getAttribute("data-dec")) - 1);
    if (rm) { window.Cart.remove(rm.getAttribute("data-rm")); window.VanvedaUI.toast("Removed from bag"); }
  });
  document.addEventListener("cart:change", renderCart);
});
</script>
</body>
</html>
