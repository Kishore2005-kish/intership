<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PNR status — Indian Railways e-ticketing prototype</title>
<meta name="description" content="Check a 10-digit PNR and see passenger status, coach and berth. Demo lookup with sample PNRs." />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<a class="skip-link" href="#main">Skip to main content</a>
<header data-site-header></header>

<main id="main" class="wrap section">
  <div style="max-width:760px">
    <h1>PNR status</h1>
    <p class="muted" style="margin-top:6px">Enter your 10-digit PNR to see the latest booking status.</p>

    <form class="card card-pad" id="pnr-form" novalidate style="margin-top:20px">
      <div class="field">
        <label for="pnr">PNR number</label>
        <input type="text" id="pnr" inputmode="numeric" maxlength="10" placeholder="10-digit PNR" aria-describedby="pnr-error pnr-hint" />
        <p class="small muted" id="pnr-hint">Demo PNRs you can try: 4517829063, 8823410597, 6390174528</p>
        <p class="error-text" id="pnr-error" role="alert"></p>
      </div>
      <button class="btn btn-primary" type="submit" style="margin-top:12px">Check Status</button>
    </form>

    <div id="result" role="region" aria-live="polite" style="margin-top:20px"></div>
  </div>
</main>

<footer data-site-footer></footer>
<script src="js/data.js"></script>
<script src="js/common.js"></script>
<script src="js/chrome.js"></script>
<script src="js/pnr.js"></script>
</body>
</html>
