<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Destinations — Wayfare Travel</title>
<meta name="description" content="Explore 12 Wayfare destinations across beaches, mountains, culture, wildlife and adventure. Filter by category and price, then sort by rating or cost.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header class="site-header" data-header></header>

<section class="page-banner">
  <div class="container">
    <div class="breadcrumb"><a href="index.html">Home</a> / Destinations</div>
    <h1>Where would you like to go?</h1>
    <p>Twelve destinations we know inside out, each with local guides and packages built around them.</p>
  </div>
</section>

<section class="section">
  <div class="container">
    <div class="toolbar">
      <div>
        <label for="q">Search</label>
        <input type="text" id="q" placeholder="Try “Bali”, “Alps”, “safari”…">
      </div>
      <div>
        <label for="category">Category</label>
        <select id="category"></select>
      </div>
      <div>
        <label for="price">Max price per person</label>
        <select id="price">
          <option value="0">Any price</option>
          <option value="85000">Under ₹85,000</option>
          <option value="125000">Under ₹1,25,000</option>
          <option value="170000">Under ₹1,70,000</option>
          <option value="250000">Under ₹2,50,000</option>
        </select>
      </div>
      <div>
        <label for="sort">Sort by</label>
        <select id="sort">
          <option value="popular">Most popular</option>
          <option value="price-asc">Price: low to high</option>
          <option value="price-desc">Price: high to low</option>
          <option value="name">Name A–Z</option>
          <option value="days">Trip length</option>
        </select>
      </div>
    </div>

    <p class="results-count" id="count"></p>
    <div class="grid grid-3" id="results"></div>
    <div class="empty" id="empty" style="display:none">
      <h3>No destinations match those filters</h3>
      <p class="muted" style="margin-top:8px">Try a broader price range or clear the search.</p>
      <button class="btn btn-ghost" style="margin-top:16px" id="reset">Reset filters</button>
    </div>
  </div>
</section>

<footer class="site-footer" data-footer></footer>

<script src="js/data.js"></script>
<script src="js/main.js"></script>
<script src="js/destinations.js"></script>
</body>
</html>
