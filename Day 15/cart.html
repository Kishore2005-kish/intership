<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your Basket — Fresh Kirana</title>
<meta name="description" content="Review your Fresh Kirana basket, update quantities, apply a promo code and see delivery charges in ₹.">
<meta property="og:title" content="Your Basket — Fresh Kirana">
<meta property="og:description" content="Update quantities and check out with UPI, card or cash on delivery.">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Dancing+Script:wght@600&family=Karla:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header data-header></header>
<main>
  <div class="page-head"><div class="wrap"><h1>Your basket</h1><p>Free delivery above ₹499. Prices include GST.</p></div></div>
  <div class="wrap section">
    <div class="cart-layout">
      <div data-lines></div>
      <aside class="summary">
        <h3>Order summary</h3>
        <div data-summary></div>
        <form class="subscribe" data-promo style="margin-top:14px">
          <input placeholder="Promo code (FRESH10)" aria-label="Promo code">
          <button type="submit">Apply</button>
        </form>
        <p class="free-note" data-promo-msg></p>
        <a class="btn btn-solid btn-block" href="checkout.html" style="margin-top:14px">Proceed to checkout</a>
        <a class="btn btn-outline btn-block" href="shop.html?category=all" style="margin-top:10px">Continue shopping</a>
      </aside>
    </div>
  </div>
</main>
<footer class="site-footer" data-footer></footer>

<script src="data.js"></script>
<script src="app.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function () {
  var linesEl = document.querySelector("[data-lines]");
  var sumEl = document.querySelector("[data-summary]");
  var promo = sessionStorage.getItem("fk-promo") === "1";

  function render() {
    var lines = cartLines();
    if (!lines.length) {
      linesEl.innerHTML = '<p class="empty">Your basket is empty. <a class="link-btn" href="shop.html?category=all">Start shopping</a></p>';
    } else {
      linesEl.innerHTML = lines.map(function (l) {
        return '<div class="cart-line">' +
          '<img src="' + productImage(l.product) + '" alt="' + l.product.name + '" width="120" height="120">' +
          '<div><a class="card-name" href="product.html?id=' + l.product.id + '">' + l.product.name + '</a>' +
          '<span class="card-unit">' + l.product.unit + ' · ' + l.product.origin + '</span></div>' +
          '<div class="stepper"><button data-dec="' + l.product.id + '" aria-label="Decrease">−</button><span>' + l.qty + '</span><button data-inc="' + l.product.id + '" aria-label="Increase">+</button></div>' +
          '<span class="price">' + formatINR(l.product.price * l.qty) + '</span>' +
          '<button class="link-btn" data-rm="' + l.product.id + '">Remove</button></div>';
      }).join("");
    }

    var subtotal = cartSubtotal();
    var discount = promo ? Math.round(subtotal * 0.1) : 0;
    var delivery = subtotal === 0 || subtotal - discount >= 499 ? 0 : 39;
    var total = subtotal - discount + delivery;
    sumEl.innerHTML =
      '<div class="summary-row"><span>Subtotal</span><span>' + formatINR(subtotal) + '</span></div>' +
      (discount ? '<div class="summary-row"><span>Promo FRESH10</span><span>− ' + formatINR(discount) + '</span></div>' : '') +
      '<div class="summary-row"><span>Delivery</span><span>' + (delivery ? formatINR(delivery) : "Free") + '</span></div>' +
      '<div class="summary-row"><strong>Total</strong><strong>' + formatINR(total) + '</strong></div>';
    sessionStorage.setItem("fk-total", String(total));
  }

  linesEl.addEventListener("click", function (e) {
    var t = e.target.closest("[data-dec],[data-inc],[data-rm]");
    if (!t) return;
    var items = readCart();
    var id = t.dataset.dec || t.dataset.inc || t.dataset.rm;
    var line = items.find(function (l) { return l.id === id; });
    if (!line) return;
    if (t.dataset.rm) setQty(id, 0);
    else setQty(id, line.qty + (t.dataset.inc ? 1 : -1));
    render();
  });

  document.querySelector("[data-promo]").addEventListener("submit", function (e) {
    e.preventDefault();
    var code = this.querySelector("input").value.trim().toUpperCase();
    var msg = document.querySelector("[data-promo-msg]");
    if (code === "FRESH10") {
      promo = true;
      sessionStorage.setItem("fk-promo", "1");
      msg.textContent = "FRESH10 applied — 10% off your basket.";
    } else {
      msg.textContent = "That code isn't valid. Try FRESH10.";
    }
    render();
  });

  render();
});
</script>
</body>
</html>
