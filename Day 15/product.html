<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Product — Fresh Kirana</title>
<meta name="description" content="Product details, origin and pricing in ₹ for Indian grocery staples from Fresh Kirana.">
<meta property="og:title" content="Product — Fresh Kirana">
<meta property="og:description" content="Sourcing details, unit size and rupee pricing for every Fresh Kirana product.">
<meta property="og:type" content="product">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Dancing+Script:wght@600&family=Karla:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header data-header></header>
<main class="wrap section" data-page></main>
<footer class="site-footer" data-footer></footer>

<script src="data.js"></script>
<script src="app.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function () {
  var page = document.querySelector("[data-page]");
  var p = P_BY_ID[qs("id")];
  if (!p) {
    page.innerHTML = '<p class="empty">Product not found. <a class="link-btn" href="shop.html?category=all">Back to shop</a></p>';
    return;
  }
  document.title = p.name + " — Fresh Kirana";
  var off = p.mrp ? Math.round(((p.mrp - p.price) / p.mrp) * 100) : 0;
  var related = PRODUCTS.filter(function (x) { return x.category === p.category && x.id !== p.id; }).slice(0, 4);

  page.innerHTML =
    '<nav class="crumbs"><a href="index.html">Home</a> / <a href="shop.html?category=' + p.category + '">' + categoryName(p.category) + '</a> / <span>' + p.name + '</span></nav>' +
    '<div class="pdp">' +
      '<div class="pdp-media"><img src="' + productImage(p) + '" alt="' + p.name + '" width="900" height="900"></div>' +
      '<div>' +
        '<h1>' + p.name + '</h1>' +
        '<span class="script" style="font-size:26px">' + p.origin + '</span>' +
        '<div class="price-row" style="margin-top:14px"><span class="price">' + formatINR(p.price) + '</span>' +
        (p.mrp ? '<span class="mrp">' + formatINR(p.mrp) + '</span><span class="off">' + off + '% off</span>' : '') + '</div>' +
        '<p>' + p.description + '</p>' +
        '<ul class="spec">' +
          '<li><span>Pack size</span>' + p.unit + '</li>' +
          '<li><span>Sourced from</span>' + p.origin + '</li>' +
          '<li><span>Category</span>' + categoryName(p.category) + '</li>' +
          '<li><span>Delivery</span>Same-day slots in metros, next-day elsewhere</li>' +
        '</ul>' +
        '<div class="stepper" style="margin:18px 0"><button data-dec aria-label="Decrease quantity">−</button><span data-qty>1</span><button data-inc aria-label="Increase quantity">+</button></div>' +
        '<button class="btn btn-solid" data-addpdp>Add to basket</button> ' +
        '<a class="btn btn-outline" href="cart.html">Go to basket</a>' +
      '</div>' +
    '</div>' +
    (related.length ? '<section class="section"><div class="section-head"><h2>You may also</h2><span class="script">like</span></div><div class="product-grid" data-rel>' + related.map(cardHTML).join("") + '</div></section>' : '');

  var qty = 1;
  var qtyEl = page.querySelector("[data-qty]");
  page.querySelector("[data-dec]").addEventListener("click", function () { qty = Math.max(1, qty - 1); qtyEl.textContent = qty; });
  page.querySelector("[data-inc]").addEventListener("click", function () { qty += 1; qtyEl.textContent = qty; });
  var addBtn = page.querySelector("[data-addpdp]");
  addBtn.addEventListener("click", function () {
    addToCart(p.id, qty);
    addBtn.textContent = "Added ✓";
    setTimeout(function () { addBtn.textContent = "Add to basket"; }, 1200);
  });
  bindCards(page);
});
</script>
</body>
</html>
